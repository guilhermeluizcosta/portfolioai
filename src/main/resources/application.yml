micronaut:
  application:
    name: portfolioai
  server:
    port: ${PORT:8080}
    host: 0.0.0.0
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /docs/**

endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS

portfolioai:
  rag:
    max-results: 8
    min-score: 0.58

langchain4j:
  open-ai:
    api-key: ${GROQ_API_KEY}
    chat-model:
      base-url: https://api.groq.com/openai/v1
      model-name: openai/gpt-oss-20b
      temperature: 0.2
      timeout: 90s